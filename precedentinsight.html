<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="5; url=https://pansamap.maru.ai.kr/">
    <title>판례인사이트 서비스 도메인 변경 안내</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 480px;
            width: 90%;
        }
        h1 {
            font-size: 1.5rem;
            color: #1a1a1a;
            margin-bottom: 12px;
        }
        p {
            font-size: 1rem;
            line-height: 1.6;
            color: #555;
            margin: 8px 0;
        }
        .timer-box {
            margin: 24px 0;
            font-size: 1.1rem;
            font-weight: 600;
            color: #2563eb;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: #2563eb;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>판례인사이트 도메인 변경 안내</h1>
        <p>판례인사이트 서비스 주소가 새로 변경되었습니다.</p>
        <p>기존 주소를 방문해 주신 분들께 감사드리며,<br>새로운 웹사이트로 연결해 드립니다.</p>
        
        <div class="timer-box">
            <span id="countdown">5</span>초 후 새로운 주소로 자동 이동합니다.
        </div>

        <a href="https://pansamap.maru.ai.kr/" class="btn">지금 바로 이동하기</a>
    </div>

    <script>
        const targetUrl = "https://pansamap.maru.ai.kr/";
        let seconds = 5;
        const countdownEl = document.getElementById("countdown");

        const timer = setInterval(() => {
            seconds--;
            if (countdownEl) {
                countdownEl.textContent = seconds;
            }
            if (seconds <= 0) {
                clearInterval(timer);
                window.location.href = targetUrl;
            }
        }, 1000);
    </script>
</body>
</html>
