<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>판례인사이트</title>
<style>
  :root {
    --navy-dark: #0D1F35;
    --navy-medium: #1A3A5C;
    --gold: #C8A84B;
    --bg: #F0F4F8;
    --white: #FFFFFF;
    --text-primary: #1A2A3A;
    --text-secondary: #555555;
    --text-hint: #999999;
    --divider: #EAECF0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: var(--bg);
    color: var(--text-primary);
  }
  header {
    background: var(--navy-dark);
    padding: 16px 16px 14px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 {
    margin: 0 0 12px;
    color: var(--white);
    font-size: 20px;
    font-weight: bold;
  }
  .search-row {
    display: flex;
    gap: 8px;
  }
  .search-row input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.1);
    color: var(--white);
    font-size: 14px;
    outline: none;
  }
  .search-row input::placeholder { color: rgba(255,255,255,0.55); }
  .search-row button {
    padding: 0 18px;
    border-radius: 10px;
    border: none;
    background: var(--gold);
    color: var(--navy-dark);
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 16px;
  }
  .card {
    background: var(--white);
    border: 1px solid var(--divider);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .card:active { opacity: 0.85; }
  .card .case-name {
    font-weight: bold;
    font-size: 15px;
    margin-bottom: 6px;
  }
  .card .meta {
    color: var(--text-secondary);
    font-size: 12.5px;
    line-height: 1.6;
  }
  .card .badge {
    display: inline-block;
    background: var(--navy-medium);
    color: var(--white);
    font-size: 11px;
    font-weight: bold;
    padding: 2px 8px;
    border-radius: 6px;
    margin-right: 6px;
  }

  /* 최저 평점 판례 섹션 (전체 판례 DB 기준, 리뷰 있는 것만) — 시상식 스타일 */
  #lowRatedSection { margin-bottom: 18px; }
  #lowRatedSection .award-card {
    background: var(--white);
    border: 1px solid var(--divider);
    border-radius: 14px;
    padding: 18px 12px 14px;
    position: relative;
    overflow: hidden;
  }
  #lowRatedSection .award-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--gold), var(--navy-medium), var(--gold));
  }
  #lowRatedSection .award-title {
    font-size: 19px;
    font-weight: 800;
    color: var(--navy-dark);
    text-align: center;
    margin: 2px 0 2px;
  }
  #lowRatedSection .award-sub {
    font-size: 12.5px;
    color: var(--text-secondary);
    text-align: center;
    margin: 0 0 14px;
  }
  #lowRatedSection .award-sub b { color: var(--navy-dark); }
  #lowRatedSection .caption {
    color: var(--text-hint);
    font-size: 10.5px;
    line-height: 1.5;
    text-align: center;
    margin: 14px 4px 0;
    padding-top: 10px;
    border-top: 1px solid var(--divider);
  }
  .podium {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 8px;
  }
  .podium-item {
    flex: 0 1 92px;
    max-width: 92px;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    cursor: pointer;
  }
  .podium-item:active { opacity: 0.85; }
  .podium-item .medal { font-size: 22px; line-height: 1; margin-bottom: 4px; }
  .podium-item .p-name {
    font-size: 12px;
    font-weight: bold;
    color: var(--text-primary);
    line-height: 1.35;
    height: 2.7em;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    padding: 0 2px;
    margin-bottom: 4px;
  }
  .podium-item .p-rating {
    font-size: 11px;
    font-weight: bold;
    color: var(--gold);
    margin-bottom: 6px;
    white-space: nowrap;
  }
  .podium-item .p-block {
    width: 100%;
    border-radius: 8px 8px 0 0;
    background: var(--navy-medium);
    color: var(--white);
    font-weight: bold;
    font-size: 15px;
    display: flex;
    justify-content: center;
    padding-top: 6px;
  }
  .podium-item.rank-1 .p-block { height: 64px; background: var(--navy-dark); font-size: 17px; }
  .podium-item.rank-2 .p-block { height: 46px; }
  .podium-item.rank-3 .p-block { height: 34px; }

  /* 폭죽 효과 */
  #confettiLayer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 9999;
  }
  .confetti-piece {
    position: absolute;
    top: -14px;
    opacity: 0.95;
    animation: confetti-fall linear forwards;
  }
  @keyframes confetti-fall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(115vh) rotate(560deg); opacity: 0.85; }
  }

  #loadMoreBtn, .btn-primary {
    display: block;
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    border: none;
    background: var(--navy-dark);
    color: var(--white);
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 6px;
  }
  #loadMoreBtn:disabled { opacity: 0.5; cursor: default; }
  .empty, .hint {
    text-align: center;
    color: var(--text-hint);
    font-size: 13px;
    padding: 40px 10px;
  }

  /* 상세 화면 */
  #detailView { display: none; }
  #detailView.active { display: block; }
  #listView.hidden { display: none; }

  .back-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  .back-row button {
    background: none;
    border: none;
    color: var(--white);
    font-size: 20px;
    cursor: pointer;
    padding: 4px 8px 4px 0;
  }
  .back-row .title {
    color: var(--white);
    font-size: 15px;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .detail-card {
    background: var(--white);
    border: 1px solid var(--divider);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .detail-card .case-name { font-size: 16px; font-weight: bold; margin-bottom: 8px; }
  .detail-card .meta { color: var(--text-secondary); font-size: 13px; line-height: 1.8; }

  .summary-body { font-size: 13.5px; line-height: 1.7; color: var(--text-primary); white-space: pre-wrap; }
  .summary-body.error { color: var(--text-hint); }

  /* AI 요약 생성 중 로딩 연출 (Gemini 느낌의 그라데이션 스파클) */
  .gemini-loading {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 0;
  }
  .gemini-spark {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    animation: gemini-pulse 1.6s ease-in-out infinite;
    transform-origin: center;
  }
  @keyframes gemini-pulse {
    0%, 100% { transform: scale(0.85) rotate(0deg); opacity: 0.65; }
    50%      { transform: scale(1.15) rotate(90deg); opacity: 1; }
  }
  .gemini-shimmer-text {
    font-size: 13.5px;
    font-weight: bold;
    background: linear-gradient(90deg, #4285F4, #9C27B0, #E91E63, #4285F4);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: gemini-shimmer 2.2s linear infinite;
  }
  @keyframes gemini-shimmer {
    0%   { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  .section-title {
    font-size: 15px;
    font-weight: bold;
    margin: 0 0 10px;
  }

  .stars { font-size: 26px; letter-spacing: 4px; cursor: pointer; user-select: none; margin-bottom: 12px; }
  .stars span { color: var(--divider); }
  .stars span.on { color: var(--gold); }

  textarea, input[type=text].plain {
    width: 100%;
    border: 1px solid var(--divider);
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
    font-family: inherit;
    margin-bottom: 10px;
    resize: vertical;
    background: var(--white);
    color: var(--text-primary);
  }
  textarea { min-height: 80px; }

  .divider-line { border: none; border-top: 1px solid var(--divider); margin: 14px 0; }

  .review-summary { font-weight: bold; font-size: 14px; margin-bottom: 10px; }

  .review-item {
    background: var(--white);
    border: 1px solid var(--divider);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .review-item .row1 {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .review-item .rating { color: var(--gold); font-size: 13px; letter-spacing: 1px; }
  .review-item .author { font-size: 12px; color: var(--text-secondary); }
  .review-item .date { font-size: 11px; color: var(--text-hint); }
  .review-item .opinion { font-size: 13.5px; line-height: 1.5; white-space: pre-wrap; }
</style>
</head>
<body>

<div id="confettiLayer"></div>

<header id="listHeader">
  <h1>⚖️ 판례인사이트</h1>
  <div class="search-row">
    <input id="searchInput" type="text" placeholder="🔍  사건명, 사건번호, 법원명 검색..." />
    <button id="searchBtn">검색</button>
  </div>
</header>

<header id="detailHeader" style="display:none;">
  <div class="back-row">
    <button id="backBtn">←</button>
    <div class="title" id="detailTitle">사건명</div>
  </div>
</header>

<main>
  <div id="listView">
    <div id="lowRatedSection" style="display:none;">
      <div class="award-card">
        <div class="award-title" id="lowRatedTitle">🎉 Congratulations!</div>
        <div class="award-sub" id="lowRatedSub">국민이 뽑은 <b>최악의 판례 TOP 3</b>에 선정되셨습니다!</div>
        <div id="lowRatedResults" class="podium"></div>
        <div class="caption" id="lowRatedCaption">판결서는 확정 후 누구나 열람할 수 있는 공개 기록입니다(형사소송법 제59조의3, 민사소송법 제163조의2).</div>
      </div>
    </div>
    <div id="results"></div>
    <button id="loadMoreBtn" style="display:none;">더 보기</button>
    <div id="emptyMsg" class="empty" style="display:none;">검색 결과가 없습니다.</div>
    <div id="initialHint" class="hint">검색어를 입력해 판례를 찾아보세요.</div>
  </div>

  <div id="detailView">
    <div class="detail-card" id="detailInfo"></div>

    <div class="detail-card" id="summaryCard">
      <div class="section-title" style="margin-bottom:8px;">⚖️ AI 요약</div>
      <div id="summaryBody" class="summary-body">요약을 불러오는 중...</div>
    </div>

    <button class="btn-primary" id="viewOriginalBtn">원문 보기 ↗</button>

    <hr class="divider-line"/>

    <div class="section-title">리뷰 작성</div>
    <div class="stars" id="ratingStars">
      <span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span>
    </div>
    <textarea id="opinionInput" placeholder="의견을 입력하세요"></textarea>
    <input class="plain" id="authorInput" type="text" placeholder="작성자 (선택, 비우면 익명)" />
    <button class="btn-primary" id="submitReviewBtn">리뷰 등록</button>

    <hr class="divider-line"/>

    <div class="review-summary" id="reviewSummary">리뷰 0건</div>
    <div id="reviewList"></div>
  </div>
</main>

<script>
  const API = "https://d2xqa2k3k9ovhh.cloudfront.net";
  let page = 1;
  let currentQuery = "";
  let currentRating = 0;
  let currentDocId = null;
  let currentLink = null;

  let searchGen = 0;         // 검색이 바뀔 때마다 증가 (오래된 응답 무시용)
  let lastPodiumIds = null;  // 마지막으로 보여준 TOP3 조합 (동일하면 폭죽 재발사 안 함)

  const el = (id) => document.getElementById(id);

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  // ── 검색/목록 ────────────────────────────────────────────────
  async function search(reset) {
    if (reset) {
      page = 1;
      el("results").innerHTML = "";
      searchGen++;
    }
    const myGen = searchGen;

    el("initialHint").style.display = "none";
    el("emptyMsg").style.display = "none";

    const params = new URLSearchParams({ page, size: 20 });
    if (currentQuery) params.set("q", currentQuery);

    const res = await fetch(`${API}/precedents?${params}`);
    if (!res.ok) return;
    const data = await res.json();
    if (myGen !== searchGen) return; // 그 사이 다른 검색이 시작됐으면 무시

    if (reset && data.items.length === 0) {
      el("emptyMsg").style.display = "block";
    }

    for (const item of data.items) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="case-name">${escapeHtml(item.case_name)}</div>
        <div class="meta">
          <span class="badge">${escapeHtml(item.case_type || "")}</span>
          ${escapeHtml(item.case_number)}<br/>
          ${escapeHtml(item.court)} · ${escapeHtml(item.date)}
        </div>`;
      card.addEventListener("click", () => openDetail(item));
      el("results").appendChild(card);
    }

    el("loadMoreBtn").style.display = data.has_more ? "block" : "none";
    page = data.page + 1;
  }

  // 전체 판례 DB(16만여 건) 중 리뷰가 1건 이상 있는 판례를 대상으로
  // 평균 평점이 가장 낮은 3개를 백엔드 집계 쿼리로 받아와 상단 위젯에 표시한다.
  async function loadWorstRated() {
    try {
      const res = await fetch(`${API}/precedents/worst-reviewed?limit=3`);
      if (!res.ok) throw new Error();
      const items = await res.json();
      renderWorstRated(items);
    } catch {
      hideLowRated();
    }
  }

  function renderWorstRated(items) {
    // 엔드포인트가 응답은 했지만(=배포됨) 순위를 매길 데이터가 없는 경우
    // (리뷰가 아예 없거나, 리뷰가 달린 판례가 전부 만점이라 대상이 없는 경우) —
    // 위젯을 숨기지 않고 리뷰 작성을 유도하는 문구로 대체한다.
    if (!items || items.length === 0) { renderReviewPrompt(); return; }

    el("lowRatedSection").style.display = "block";
    el("lowRatedTitle").textContent = "🎉 Congratulations!";
    el("lowRatedSub").innerHTML = "국민이 뽑은 <b>최악의 판례 TOP 3</b>에 선정되셨습니다!";
    el("lowRatedCaption").textContent = "판결서는 확정 후 누구나 열람할 수 있는 공개 기록입니다(형사소송법 제59조의3, 민사소송법 제163조의2).";

    const box = el("lowRatedResults");
    box.className = "podium";
    box.innerHTML = "";

    // 시상대 배치: 가운데(가장 낮은 평점) - 왼쪽(2위) - 오른쪽(3위)
    const MEDAL = ["🥇", "🥈", "🥉"];
    const order =
      items.length === 1 ? [0] :
      items.length === 2 ? [1, 0] :
      [1, 0, 2];

    order.forEach((idx) => {
      const item = items[idx];
      const rank = idx + 1; // 1 = 평점이 가장 낮은 판례
      const slot = document.createElement("div");
      slot.className = `podium-item rank-${rank}`;
      slot.innerHTML = `
        <div class="medal">${MEDAL[rank - 1]}</div>
        <div class="p-name">${escapeHtml(item.case_name)}</div>
        <div class="p-rating">★${item.average_rating.toFixed(1)} · ${item.review_count}건</div>
        <div class="p-block">${rank}</div>`;
      slot.addEventListener("click", () => openDetail(item));
      box.appendChild(slot);
    });

    // TOP3 구성이 이전과 달라졌을 때만 폭죽을 새로 터뜨림 (동일 목록 재표시 시 중복 방지)
    const idsKey = items.map((x) => x.doc_id).join(",");
    if (idsKey !== lastPodiumIds) {
      lastPodiumIds = idsKey;
      fireConfetti();
    }
  }

  function renderReviewPrompt() {
    el("lowRatedSection").style.display = "block";
    el("lowRatedTitle").textContent = "✍️ 첫 리뷰를 남겨주세요";
    el("lowRatedSub").innerHTML = "아직 순위를 매길 만큼 리뷰가 쌓이지 않았어요.<br/>판례에 별점과 의견을 남겨보세요!";
    el("lowRatedCaption").textContent = "리뷰가 쌓이면 국민이 뽑은 최악의 판례 TOP 3가 이 자리에 나타납니다.";
    el("lowRatedResults").className = "";
    el("lowRatedResults").innerHTML = "";
    lastPodiumIds = null;
  }

  function hideLowRated() {
    el("lowRatedSection").style.display = "none";
    el("lowRatedResults").innerHTML = "";
    lastPodiumIds = null;
  }

  // 시상대 등장 시 터지는 폭죽 효과
  const CONFETTI_COLORS = ["#C8A84B", "#E85D75", "#4C9F70", "#4A90D9", "#F2B807", "#8E5FD4"];
  function fireConfetti() {
    const layer = el("confettiLayer");
    if (!layer) return;
    const count = 60;
    for (let i = 0; i < count; i++) {
      const piece = document.createElement("div");
      piece.className = "confetti-piece";
      const size = 6 + Math.random() * 6;
      const duration = 2.2 + Math.random() * 1.4;
      const delay = Math.random() * 0.35;
      piece.style.left = `${Math.random() * 100}vw`;
      piece.style.width = `${size}px`;
      piece.style.height = `${size * 1.6}px`;
      piece.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
      piece.style.borderRadius = Math.random() < 0.5 ? "50%" : "2px";
      piece.style.animationDuration = `${duration}s`;
      piece.style.animationDelay = `${delay}s`;
      layer.appendChild(piece);
      setTimeout(() => piece.remove(), (duration + delay) * 1000 + 150);
    }
  }

  el("searchBtn").addEventListener("click", () => {
    currentQuery = el("searchInput").value.trim();
    search(true);
  });
  el("searchInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { currentQuery = el("searchInput").value.trim(); search(true); }
  });
  el("loadMoreBtn").addEventListener("click", () => search(false));

  // 안드로이드 앱과 동일하게, 검색어 없이 열자마자 최신 판례 목록을 바로 보여준다.
  search(true);
  loadWorstRated();

  // ── 상세 화면 ────────────────────────────────────────────────
  function openDetail(item) {
    currentDocId = item.doc_id;
    currentLink = item.link;
    currentRating = 0;

    el("listHeader").style.display = "none";
    el("detailHeader").style.display = "block";
    el("listView").classList.add("hidden");
    el("detailView").classList.add("active");

    el("detailTitle").textContent = item.case_name;
    el("detailInfo").innerHTML = `
      <div class="case-name">${escapeHtml(item.case_name)}</div>
      <div class="meta">
        사건번호: ${escapeHtml(item.case_number)}<br/>
        법원: ${escapeHtml(item.court)}<br/>
        선고일자: ${escapeHtml(item.date)}<br/>
        사건종류: ${escapeHtml(item.case_type)}
      </div>`;

    el("opinionInput").value = "";
    el("authorInput").value = "";
    setStars(0);

    loadReviews();
    loadSummary(item.doc_id);
  }

  const _GEMINI_SPARK_SVG = `
    <svg class="gemini-spark" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#4285F4"/>
          <stop offset="50%" stop-color="#9C27B0"/>
          <stop offset="100%" stop-color="#E91E63"/>
        </linearGradient>
      </defs>
      <path fill="url(#geminiGrad)" d="M12 1 C13 8 16 11 23 12 C16 13 13 16 12 23 C11 16 8 13 1 12 C8 11 11 8 12 1 Z"/>
    </svg>`;

  async function loadSummary(docId) {
    const body = el("summaryBody");
    body.className = "summary-body";
    body.innerHTML = `
      <div class="gemini-loading">
        ${_GEMINI_SPARK_SVG}
        <span class="gemini-shimmer-text">AI가 판례 원문을 분석하고 있어요...</span>
      </div>`;

    try {
      const res = await fetch(`${API}/precedents/${encodeURIComponent(docId)}/summary`);
      if (docId !== currentDocId) return; // 그 사이 다른 판례로 넘어갔으면 무시
      if (!res.ok) throw new Error();
      const data = await res.json();
      body.className = "summary-body";
      body.textContent = data.summary;
    } catch {
      if (docId !== currentDocId) return;
      body.className = "summary-body error";
      body.textContent = "AI 요약을 불러오지 못했습니다.";
    }
  }

  el("backBtn").addEventListener("click", () => {
    el("listHeader").style.display = "block";
    el("detailHeader").style.display = "none";
    el("listView").classList.remove("hidden");
    el("detailView").classList.remove("active");
    loadWorstRated(); // 상세에서 평점을 남겼을 수 있으니 위젯 갱신
  });

  el("viewOriginalBtn").addEventListener("click", () => {
    if (currentLink) window.open(currentLink, "_blank", "noopener,noreferrer");
  });

  function setStars(v) {
    currentRating = v;
    document.querySelectorAll("#ratingStars span").forEach((s) => {
      s.classList.toggle("on", Number(s.dataset.v) <= v);
    });
  }
  document.querySelectorAll("#ratingStars span").forEach((s) => {
    s.addEventListener("click", () => setStars(Number(s.dataset.v)));
  });

  async function loadReviews() {
    const res = await fetch(`${API}/precedents/${encodeURIComponent(currentDocId)}/reviews`);
    if (!res.ok) return;
    const data = await res.json();

    el("reviewSummary").textContent = data.average_rating != null
      ? `리뷰 ${data.count}건 · 평균 ★${data.average_rating.toFixed(1)}`
      : `리뷰 ${data.count}건`;

    el("reviewList").innerHTML = data.items.map((r) => `
      <div class="review-item">
        <div class="row1">
          <div><span class="rating">${"★".repeat(r.rating)}${"☆".repeat(5 - r.rating)}</span> <span class="author">${escapeHtml(r.author_name)}</span></div>
          <div class="date">${escapeHtml((r.created_at || "").slice(0, 10).replace(/-/g, "."))}</div>
        </div>
        <div class="opinion">${escapeHtml(r.opinion)}</div>
      </div>
    `).join("") || `<div class="empty">아직 등록된 리뷰가 없습니다</div>`;
  }

  el("submitReviewBtn").addEventListener("click", async () => {
    const opinion = el("opinionInput").value.trim();
    if (currentRating < 1) { alert("별점을 선택해주세요."); return; }
    if (!opinion) { alert("의견을 입력해주세요."); return; }

    const btn = el("submitReviewBtn");
    btn.disabled = true;
    btn.textContent = "등록 중...";

    try {
      const res = await fetch(`${API}/precedents/${encodeURIComponent(currentDocId)}/reviews`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          rating: currentRating,
          opinion,
          author_name: el("authorInput").value.trim() || null,
        }),
      });
      if (!res.ok) throw new Error();

      el("opinionInput").value = "";
      el("authorInput").value = "";
      setStars(0);
      await loadReviews();
    } catch {
      alert("리뷰 등록에 실패했습니다.");
    } finally {
      btn.disabled = false;
      btn.textContent = "리뷰 등록";
    }
  });
</script>
</body>
</html>
